let refreshing=null;
function jwtExp(t){try{return JSON.parse(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/'))).exp*1000}catch(e){return 0}}
function refreshSess(){if(!sess||!sess.refresh_token)return Promise.resolve(false);
  if(!refreshing)refreshing=(async()=>{try{const r=await fetch(SB+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:sess.refresh_token})});const d=await r.json();if(r.ok&&d.access_token){sess=d;ls.set('loja_sess',d);return true}}catch(e){}return false})().finally(()=>{refreshing=null});
  return refreshing}
async function api(path,o={}){
  if(sess&&sess.access_token&&!path.startsWith('/auth/')&&jwtExp(sess.access_token)-Date.now()<90000)await refreshSess();
  const hd={apikey:KEY,...(o.headers||{})};
  if(sess?.access_token)hd.Authorization='Bearer '+sess.access_token;
  if(o.json!==undefined){hd['Content-Type']='application/json';o.body=JSON.stringify(o.json)}
  let r,txt;
  for(let t=0;t<3;t++){try{r=await fetch(SB+path,{method:o.method||'GET',headers:hd,body:o.body});break}catch(e){if(t===2)throw new Error('Sem conexão. Verifique a internet.');await new Promise(z=>setTimeout(z,700*(t+1)))}}
  txt=await r.text();let d=null;try{d=txt?JSON.parse(txt):null}catch(e){d=txt}
  if(r.status===401&&sess&&!path.startsWith('/auth/')&&/JWT|expired/i.test(JSON.stringify(d))){
    if(!o._r&&await refreshSess())return api(path,{...o,_r:1,headers:{...(o.headers||{})}});
    sess=null;ls.set('loja_sess',null);
    if((o.method||'GET')!=='GET')throw new Error('Sua sessão expirou. Recarregue a página e entre de novo no admin.');
    const o2={...o,headers:{...(o.headers||{})}};delete hd.Authorization;return api(path,o2)}
  if(!r.ok)throw new Error((d&&(d.message||d.msg||d.error_description||d.error))||('Erro '+r.status));
  return d;
}

function shrink(file,max=1100){return new Promise((ok,no)=>{
  if(!file.type.startsWith('image/'))return ok(file);
  const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?ok(b):no(new Error('Imagem inválida'))},'image/jpeg',.82)};
  im.onerror=()=>no(new Error('Não consegui ler a imagem'));im.src=u})}

async function geoMulti(q,og){
  const tipo=/^(rua|r|avenida|av|travessa|tv|trav|estrada|est|rodovia|alameda|al|praca|pca|beco)\b[\s.,]*/i;

  if(partes.length>=2&&/^(rua|r|avenida|av|travessa|tv|estrada|rodovia|alameda|praca|beco)\.?$/i.test(partes[0])){rua=partes[0]+' '+partes[1];dica=partes.slice(2)}
  const semTipo=rua.replace(tipo,'').trim();
  const variantes=[...new Set([rua,semTipo,base.replace(/,/g,' ')].filter(x=>x))];
  const get=async(qq,bound)=>{const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&limit=30&countrycodes=br'+(og?'&viewbox='+vbox(og,0.6)+(bound?'&bounded=1':''):'')+'&q='+encodeURIComponent(qq),{headers:{'Accept-Language':'pt-BR'}});return r.json()};
  let d=[];
  for(const bound of [true,false]){
    for(const v of variantes){d=await get(v,bound&&!!og);if(d&&d.length)break;await new Promise(z=>setTimeout(z,1100))}
    if(d&&d.length)break}

  const toks=sem(dica.join(' ')).split(' ').filter(t=>t.length>=3);
  (d||[]).forEach(x=>{const a=x.address||{};const lugar=a.city||a.town||a.village||a.municipality||a.city_district||'';
    const bairro=a.suburb||a.neighbourhood||a.quarter||'';
    const nome=[a.road||a.pedestrian||a.footway||'',bairro,lugar,a.state_code||a.state||''].filter(Boolean).join(', ')||String(x.display_name).split(',').slice(0,4).join(',');
    if(seen[nome])return;seen[nome]=1;
    const o={nome,lat:+x.lat,lon:+x.lon};o.d=og?hav(og,o):0;

  const d=await distKm(o.pt,d0.pt);

  return{tipo:'entrega',km,min:d.min,valor,alt,opt:o.pt,um:Math.round(d.km*10)/10,ori:(o.end&&o.end!=='Local escolhido')?o.end:'Localização da loja (marcada no mapa)',end:d0.end,pt:d0.pt,desc:`Frete (${km.toString().replace('.',',')} km)`,aprox:d0.aprox||o.aprox||!d.exato}}

function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function pixPayload(chave,nome,cidade,valor,txid){
  const f=(id,v)=>id+String(v.length).padStart(2,'0')+v;
  const norm=(s,n)=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase().slice(0,n)||'LOJA';
  const body=f('00','01')+f('26',f('00','br.gov.bcb.pix')+f('01',chave))+f('52','0000')+f('53','986')+f('54',Number(valor).toFixed(2))+f('58','BR')+f('59',norm(nome,25))+f('60',norm(cidade,15))+f('62',f('05',(txid||'***').replace(/[^A-Za-z0-9]/g,'').slice(0,25)||'***'))+'6304';
  return body+crc16(body);
}

  $('#pc1').onchange=()=>{$('#pc2').style.display=$('#pc1').value==='__nova'?'block':'none';if($('#pc1').value==='__nova')$('#pc2').focus()};
  $('#pa').onclick=()=>$('#pf').click();
  $('#pf').onchange=e=>{adm.files=[...adm.files,...e.target.files];$('#pn').textContent=adm.files.length+' foto(s) para enviar'};
  document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{p.imagens.splice(+b.dataset.r,1);capture();aForm()});
  const capture=()=>{p.nome=$('#pn1').value;p.preco=$('#pp').value;p.preco_atacado=$('#ppa').value;p.custo=$('#pcu').value;p.categoria=$('#pc1').value==='__nova'?$('#pc2').value.trim():$('#pc1').value;p.descricao=$('#pd').value;p.estoque=$('#pe').value===''?null:parseInt($('#pe').value,10);p.ativo=$('#pa1').checked};
  const num=x=>parseFloat(String(x||'').replace(',','.'));
  const luc=()=>{const c=num($('#pcu').value),v=num($('#pp').value),a=num($('#ppa').value);const l1=lucroTxt(v,c),l2=lucroTxt(a,c);
    $('#plc').innerHTML=c>0?`<b>Lucro</b><div>Varejo: ${l1||'—'}</div>${a>0?`<div>Atacado: ${l2||'—'}</div>`:''}`:'<span class="muted">Informe o valor de compra para ver o lucro em porcentagem.</span>'};
  ['#pp','#ppa','#pcu'].forEach(k=>$(k).oninput=luc);luc();
  $('#pcx').onclick=()=>{adm.edit=null;aProdutos()};
  if($('#pdx'))$('#pdx').onclick=async()=>{if(!$('#pdx').dataset.s){$('#pdx').dataset.s=1;$('#pdx').textContent='Tem certeza? Toque de novo';return}
    try{await api('/rest/v1/loja_produtos?id=eq.'+p.id,{method:'DELETE'});prods=prods.filter(x=>x.id!==p.id);adm.edit=null;toast('Excluído');aProdutos()}catch(e){toast(e.message)}};
  $('#ps').onclick=async()=>{capture();
    const preco=parseFloat(String(p.preco).replace(',','.'));
    if(!p.nome.trim()||isNaN(preco)){toast('Informe nome e preço');return}
    $('#ps').disabled=true;$('#ps').textContent='Salvando...';
    try{
      for(const f of adm.files)p.imagens.push(await upload(f,'produtos'));
      const row={nome:p.nome.trim().toUpperCase(),descricao:p.descricao,preco,categoria:p.categoria.trim(),imagens:p.imagens,estoque:p.estoque,ativo:p.ativo};
      const pa=parseFloat(String(p.preco_atacado??'').replace(',','.'));if(!isNaN(pa))row.preco_atacado=pa;else if(p.id&&prod(p.id)&&prod(p.id).preco_atacado!=null)row.preco_atacado=null;
      let pid=p.id;
      if(p.id)await api('/rest/v1/loja_produtos?id=eq.'+p.id,{method:'PATCH',json:row});
      else{const r=await api('/rest/v1/loja_produtos',{method:'POST',json:row,headers:{Prefer:'return=representation'}});pid=r&&r[0]&&r[0].id}
      const cu=parseFloat(String(p.custo??'').replace(',','.'));
      try{if(pid&&!isNaN(cu))await api('/rest/v1/loja_custos',{method:'POST',json:{produto_id:pid,custo:cu},headers:{Prefer:'resolution=merge-duplicates,return=minimal'}});
        else if(pid&&adm.custos[pid]!=null)await api('/rest/v1/loja_custos?produto_id=eq.'+pid,{method:'DELETE'})}
      catch(e2){toast('Produto salvo, mas o custo não: '+e2.message)}
      await loadCustos();
      prods=await api('/rest/v1/loja_produtos?select=*&order=created_at.desc');prods.sort(ABC);adm.edit=null;adm.files=[];toast('Produto salvo! 🎉');aProdutos();
    }catch(e){toast(e.message);$('#ps').disabled=false;$('#ps').textContent='Salvar produto'}};
}
function aFrete(){
  const num=v=>String(v??'').replace('.',',');
  $('#ad').innerHTML=`<div class="box"><h3>Valores do frete ⚙️</h3>
  <label for="kor">Endereço de saída (de onde sai a entrega)</label><p class="muted" style="margin:0 0 4px">Pode ser o CEP (ex.: 28905-000, 120), um endereço completo ou a sua localização.</p><textarea class="f" id="kor" rows="3" style="min-height:84px" placeholder="CEP ou rua, número, bairro, cidade">${h(cfg.frete_origem||'Cabo Frio, RJ')}</textarea>
  <button class="btn small violet" id="kgps" type="button">📍 Usar minha localização</button> <span class="muted" id="kgm"></span>
  <label for="kkm">Valor por km (R$)</label><input class="f" id="kkm" inputmode="decimal" value="${num(cfg.frete_km)}" placeholder="Ex.: 2,50">
  <label for="kmn">Frete mínimo (R$)</label><input class="f" id="kmn" inputmode="decimal" value="${num(cfg.frete_min)}" placeholder="Ex.: 10">
  <label><input type="checkbox" id="kvt" ${cfg.frete_volta?'checked':''}> Cobrar ida e volta (dobra a distância)</label>
  <p class="muted">Os valores são salvos sozinhos quando você toca em Calcular.</p></div>
  <div class="box"><h3>Calculadora de frete 🚚</h3>
  <label for="kcep">CEP do cliente</label><input class="f" id="kcep" inputmode="numeric" maxlength="9" placeholder="00000-000">
  <label for="knum">Número / complemento (opcional)</label><input class="f" id="knum" placeholder="Ex.: 120">
  <label for="kend">Ou o endereço completo do cliente</label><textarea class="f" id="kend" rows="3" style="min-height:84px" placeholder="Rua, número, bairro, cidade"></textarea>
  <p></p><button class="btn block" id="kgo">Calcular</button><p class="muted" id="kmsg"></p>
  <div id="kres"></div></div>`;
  $('#kgps').onclick=()=>{
    const m=$('#kgm');
    if(!navigator.geolocation){m.textContent='Este aparelho não permite localização.';return}
    m.textContent='Procurando você...';
    navigator.geolocation.getCurrentPosition(async pos=>{
      const la=pos.coords.latitude,lo=pos.coords.longitude;let nome='Minha localização';
      try{const r=await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&zoom=18&lat=${la}&lon=${lo}`,{headers:{'Accept-Language':'pt-BR'}});const d=await r.json();if(d&&d.display_name)nome=d.display_name.split(',').slice(0,4).join(',').trim()}catch(e){}
      const t=`${nome} (${la.toFixed(5)}, ${lo.toFixed(5)})`;$('#kor').value=t;
      cfg={...cfg,frete_origem:t};api('/rest/v1/loja_config?id=eq.1',{method:'PATCH',json:{frete_origem:t}}).then(()=>{m.textContent='Localização salva ✅'}).catch(e=>{m.textContent='Não consegui salvar: '+e.message})
    },err=>{m.textContent=err.code===1?'Permissão negada. Libere a localização no navegador.':'Não consegui pegar a localização. Tente de novo.'},{enableHighAccuracy:true,timeout:15000});
  };
  $('#kgo').onclick=async()=>{
    const pf=v=>parseFloat(String(v).replace(',','.'))||0;
    const nv={frete_origem:$('#kor').value.trim()||'Cabo Frio, RJ',frete_km:pf($('#kkm').value),frete_min:pf($('#kmn').value),frete_volta:$('#kvt').checked};
    if(!(nv.frete_km>0)){toast('Preencha o valor por km');return}
    const b=$('#kgo'),m=$('#kmsg');b.disabled=true;b.textContent='Calculando...';m.textContent='';$('#kres').innerHTML='';
    const mudou=Object.keys(nv).some(k=>String(cfg[k]??'')!==String(nv[k]));
    cfg={...cfg,...nv};
    if(mudou)api('/rest/v1/loja_config?id=eq.1',{method:'PATCH',json:nv}).catch(e=>toast('Não consegui salvar os valores: '+e.message));
    try{
      const cepOk=($('#kcep').value||'').replace(/\D/g,'').length===8,txtK=$('#kend').value.trim();
      if(!cepOk&&txtK&&!COORD.test(txtK)&&!/\d{5}-?\d{3}/.test(txtK)){
        const vl=await viaList(txtK);
        if(vl.length){
          const cu=await cidadeUF()||{cidade:'',uf:''};
          const ogv=await locate('','',cfg.frete_origem||'Cabo Frio, RJ');if(ogv.pt)BIAS=ogv.pt;
          const pintar=(fim)=>{
            $('#kres').innerHTML=`<div class="box" style="background:#f3ecff"><b>${vl.length>1?'Achei mais de um endereço. Toque no correto:':'Confirme o endereço:'}</b>${fim?'':'<div class="muted">Calculando as distâncias...</div>'}${vl.map((o,i)=>`<button class="btn small ghost block" style="margin-top:8px;text-align:left" data-vl="${i}">📍 ${h(o.rua)} — <b>${h(o.bairro||'sem bairro')}</b> <span class="muted">(CEP ${h(fmtCep(o.cep))}${o.km!=null?' · ~'+String(o.km).replace('.',',')+' km':(fim?' · distância não encontrada':'')})</span></button>`).join('')}<p class="muted">Se souber o número, preencha o campo "Número" antes de tocar.</p></div>`;
            document.querySelectorAll('[data-vl]').forEach(bt=>bt.onclick=()=>{const o=vl[+bt.dataset.vl];$('#kcep').value=o.cep;$('#kend').value='';$('#kgo').click()})};
          pintar(false);b.disabled=false;b.textContent='Calcular';
          if(ogv.pt){
            for(const o of vl){
              let pt=null;
              try{pt=await geo(`${o.rua}, ${o.bairro}, ${cu.cidade}, ${cu.uf}`);if(!pt)pt=await cepCoord(o.cep);if(!pt){await new Promise(z=>setTimeout(z,1100));pt=await geo(`${o.bairro}, ${cu.cidade}, ${cu.uf}`)}}catch(e){}
              if(pt){o.km=Math.round(hav(ogv.pt,pt)*1.3*10)/10}
              if(!ls.get('geo3:'+`${o.rua}, ${o.bairro}, ${cu.cidade}, ${cu.uf}`.toLowerCase()+(BIAS?'|'+BIAS.lat.toFixed(2)+','+BIAS.lon.toFixed(2):''),null))await new Promise(z=>setTimeout(z,1100));
              pintar(false)}
            vl.sort((a,b)=>(a.km==null)-(b.km==null)||a.km-b.km);
          }
          pintar(true);return}
        const og=await locate('','',cfg.frete_origem||'Cabo Frio, RJ');if(og.pt)BIAS=og.pt;
        const op=await geoMulti(txtK,og.pt);
        if(!op.length)throw new Error('Não encontrei esse endereço perto da loja. Confira o nome da rua ou use o CEP.');
        if(op.length===1){$('#kend').value=`${op[0].nome} (${op[0].lat.toFixed(6)}, ${op[0].lon.toFixed(6)})`;b.disabled=false;b.textContent='Calcular';return $('#kgo').click()}
        if(op.length>1){
          $('#kres').innerHTML=`<div class="box" style="background:#f3ecff"><b>Achei mais de um endereço. Toque no correto:</b>${op.map((o,i)=>`<button class="btn small ghost block" style="margin-top:8px;text-align:left" data-op="${i}">📍 ${h(o.nome)}${og.pt?` <span class="muted">(~${Math.round(hav(og.pt,o)*1.3)} km)</span>`:''}</button>`).join('')}</div>`;
          document.querySelectorAll('[data-op]').forEach(bt=>bt.onclick=()=>{const o=op[+bt.dataset.op];$('#kend').value=`${o.nome} (${o.lat.toFixed(6)}, ${o.lon.toFixed(6)})`;$('#kgo').click()});
          b.disabled=false;b.textContent='Calcular';return}}
      const r=await freteCore($('#kcep').value,$('#knum').value,$('#kend').value);
      const km=String(r.km).replace('.',',');
      const msg=`Olá! O frete de ${r.ori||'nossa loja'} para ${r.end||'o seu endereço'} fica ${brl(r.valor)} (${km} km${cfg.frete_volta?', ida e volta':''}). 🚚`;
      $('#kres').innerHTML=`<div class="box" style="background:#f3ecff"><div style="margin-bottom:6px"><span class="muted" style="font-weight:800;font-size:12px">🏁 SAÍDA (loja)</span><div style="font-weight:700">${h(r.ori||'')}</div></div><div><span class="muted" style="font-weight:800;font-size:12px">📍 DESTINO (cliente)</span><div style="font-weight:700">${h(r.end||'')}</div></div><div style="margin:8px 0 6px">Distância: <b>${km} km</b>${cfg.frete_volta?' (ida e volta)':''}<div class="muted">Só a ida: ${String(r.um).replace('.',',')} km${cfg.frete_volta?' × 2':''}</div></div><div class="price" style="font-size:32px">${brl(r.valor)}</div>${r.aprox?'<p class="muted">Valor aproximado: o endereço foi localizado pela região. Confira antes de passar ao cliente.</p>':''}${r.alt?`<div class="box" style="background:#fff7ed;border:2px solid #fdba74"><b>⚠️ Confira antes de cobrar!</b><div>Dois mapas deram posições diferentes para o destino (${String(r.alt.dif).replace('.',',')} km de diferença).</div><div>• Pelo endereço: <b>${km} km · ${brl(r.valor)}</b></div><div>• Pelo CEP: <b>${String(r.alt.km).replace('.',',')} km · ${brl(r.alt.valor)}</b></div></div>`:''}<a class="btn small ghost" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&origin=${r.opt.lat},${r.opt.lon}&destination=${r.pt.lat},${r.pt.lon}&travelmode=driving">🗺️ Conferir rota no mapa</a> <p></p><button class="btn small violet" id="kcp">Copiar mensagem</button> <a class="btn small green" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank">Enviar no WhatsApp</a> <a class="btn small" style="background:#33ccff;color:#06324a" href="https://waze.com/ul?ll=${r.pt.lat},${r.pt.lon}&navigate=yes" target="_blank">🚗 Abrir no Waze</a></div>`;
      $('#kcp').onclick=async()=>{try{await navigator.clipboard.writeText(msg);toast('Mensagem copiada ✅')}catch(e){toast('Não consegui copiar')}};
    }catch(e){m.textContent=e.message||'Erro ao calcular.'}
    b.disabled=false;b.textContent='Calcular'};
}
function aCupons(){
  if(adm.cupons==null){$('#ad').innerHTML='<div class="box"><b>🎟️ Cupons</b><p class="muted">Falta rodar o comando novo no Supabase (o app te avisou no chat). Depois, feche e abra o painel.</p></div>';return}
  $('#ad').innerHTML=`<div class="box"><h3>🎟️ Novo cupom</h3>
  <label for="kc">Código (ex.: BARRO10)</label><input class="f" id="kc" autocapitalize="characters" style="text-transform:uppercase">
  <div class="row" style="gap:8px"><div class="grow"><label for="kv">Desconto</label><input class="f" id="kv" inputmode="decimal" placeholder="10"></div><div style="width:110px"><label for="kt">Tipo</label><select class="f" id="kt"><option value="pct">%</option><option value="rs">R$</option></select></div></div>
  <div class="row" style="gap:8px"><div class="grow"><label for="km">Compra mínima (R$)</label><input class="f" id="km" inputmode="decimal" placeholder="opcional"></div><div class="grow"><label for="ku">Limite de usos</label><input class="f" id="ku" inputmode="numeric" placeholder="opcional"></div></div>
  <p></p><button class="btn block" id="kn">Criar cupom</button></div>`+
  (adm.cupons.length?adm.cupons.map(c=>`<div class="box"><div class="row"><b class="grow" style="font-size:18px">${h(c.codigo)}</b><span class="tag" style="background:${c.ativo?'#16a34a':'#999'}">${c.ativo?'Ativo':'Desligado'}</span></div>
  <div>${c.tipo==='pct'?Number(c.valor)+'%':brl(c.valor)} de desconto${c.min_compra>0?' · compra mínima '+brl(c.min_compra):''}</div><div class="muted">Usado ${c.usos} vez(es)${c.max_usos?' de '+c.max_usos:''}</div>
  <div class="pbt"><button class="btn small ghost" data-kt="${h(c.codigo)}">${c.ativo?'Desligar':'Ligar'}</button><button class="btn small" style="background:#e53935" data-kd="${h(c.codigo)}">🗑️ Excluir</button></div></div>`).join(''):'<div class="empty"><div class="big">🎟️</div><h2>Nenhum cupom ainda</h2></div>');
  $('#kn').onclick=async()=>{const codigo=$('#kc').value.trim().toUpperCase().replace(/\s+/g,'');const valor=parseFloat($('#kv').value.replace(',','.'));if(!codigo||!(valor>0)){toast('Informe o código e o desconto');return}
    if($('#kt').value==='pct'&&valor>100){toast('Máximo 100%');return}
    try{await api('/rest/v1/loja_cupons',{method:'POST',json:{codigo,tipo:$('#kt').value,valor,min_compra:parseFloat($('#km').value.replace(',','.'))||0,max_usos:parseInt($('#ku').value)||null}});
      adm.cupons=await api('/rest/v1/loja_cupons?select=*&order=created_at.desc');toast('Cupom criado! 🎟️');aCupons()}catch(e){toast(/duplicate|unique/i.test(e.message)?'Esse código já existe':e.message)}};
  document.querySelectorAll('[data-kt]').forEach(b=>b.onclick=async()=>{const c=adm.cupons.find(x=>x.codigo===b.dataset.kt);try{await api('/rest/v1/loja_cupons?codigo=eq.'+encodeURIComponent(c.codigo),{method:'PATCH',json:{ativo:!c.ativo}});c.ativo=!c.ativo;aCupons()}catch(e){toast(e.message)}});
  document.querySelectorAll('[data-kd]').forEach(b=>b.onclick=async()=>{if(!confirm('Excluir o cupom '+b.dataset.kd+'?'))return;try{await api('/rest/v1/loja_cupons?codigo=eq.'+encodeURIComponent(b.dataset.kd),{method:'DELETE'});adm.cupons=adm.cupons.filter(x=>x.codigo!==b.dataset.kd);aCupons()}catch(e){toast(e.message)}});
}
function aConfig(){

  $('#bkp').onclick=()=>{backup();toast('Baixando as planilhas… 💾')};

    try{await api('/rest/v1/loja_config?id=eq.1',{method:'PATCH',json:n});cfg={...cfg,...n};document.title=cfg.nome;setLogo();toast('Salvo! ✅')}catch(e){toast(e.message)}};
}

/* ---------- rotas ---------- */
function route(){
  const z=$('#zap');if(z)z.classList.toggle('off',/^#\/(recibo|admin)/.test(location.hash));
  const [,a,b]=(location.hash||'#/').split('/');window.scrollTo(0,0);
  if(a==='produto')vProduto(b);else if(a==='carrinho')vCarrinho();else if(a==='pedido')vPedido(b);else if(a==='recibo')vRecibo(b);else if(a==='admin')vAdmin();else vHome();
}
addEventListener('hashchange',route);
load().then(route);
</script>

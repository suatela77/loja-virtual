<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff3d81">
<link rel="icon" href="favicon.png">
<title>Loja</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff3d81;--orange:#ff8a00;--yellow:#ffd23f;--teal:#00c2a8;--blue:#3b82f6;--violet:#7c3aed;--ink:#2a1b4d;--soft:#fff7fb;--card:#fff;--muted:#7a6a99}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background-image:radial-gradient(#ffd23f33 2px,transparent 2px);background-size:26px 26px;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--soft);padding-bottom:90px}
h1,h2,h3,.disp{font-family:'Baloo 2',Nunito,sans-serif;margin:0;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:linear-gradient(90deg,var(--pink),var(--orange));color:#fff;box-shadow:0 4px 18px #ff3d8155}
header.top .wrap{display:flex;align-items:center;gap:10px;padding-top:10px;padding-bottom:10px}
.logo{font-family:'Baloo 2';font-weight:800;font-size:24px;text-decoration:none;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{position:relative;border:0;background:#ffffff33;color:#fff;border-radius:999px;padding:9px 14px;font-weight:800;cursor:pointer;text-decoration:none}
.iconbtn b{position:absolute;top:-6px;right:-4px;background:var(--yellow);color:var(--ink);border-radius:999px;min-width:22px;height:22px;display:grid;place-items:center;font-size:13px}
.hero{background:linear-gradient(135deg,var(--violet),var(--pink) 55%,var(--orange));color:#fff;border-radius:0 0 32px 32px;padding:26px 0 34px;position:relative;overflow:hidden}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;opacity:.35}
.hero:before{width:180px;height:180px;background:var(--yellow);right:-40px;top:-50px}
.hero:after{width:120px;height:120px;background:var(--teal);left:-30px;bottom:-40px}
.hero .wrap{position:relative;z-index:1}
.hero h1{font-size:clamp(30px,7vw,52px);font-weight:800}
.hero p{margin:8px 0 16px;font-size:18px;font-weight:700;opacity:.95}
.search{display:flex;background:#fff;border-radius:999px;padding:6px 6px 6px 18px;box-shadow:0 8px 24px #0003}
.search input{flex:1;border:0;outline:0;background:none;color:var(--ink);min-width:0}
.aviso{background:var(--yellow);color:var(--ink);font-weight:800;text-align:center;padding:8px 16px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:16px 16px 4px;max-width:1000px;margin:0 auto;scrollbar-width:none}
.chip{border:0;border-radius:999px;padding:9px 16px;font-weight:800;cursor:pointer;white-space:nowrap;background:#fff;box-shadow:0 2px 8px #7c3aed22}
.chip.on{color:#fff;background:var(--violet)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;padding:14px 0}
.pcard{background:var(--card);border-radius:22px;overflow:hidden;text-decoration:none;box-shadow:0 6px 18px #2a1b4d14;display:flex;flex-direction:column;border-bottom:6px solid var(--c);transition:transform .15s}
.pcard:active{transform:scale(.97)}
.pimg{aspect-ratio:1;background:var(--c);display:grid;place-items:center;font-size:54px;position:relative}
.pimg img{width:100%;height:100%;object-fit:cover;display:block}
.pimg i{position:absolute;top:8px;left:8px;background:#fff;color:var(--ink);border-radius:999px;font-style:normal;font-weight:800;font-size:12px;padding:3px 10px}
.pbody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.pbody h3{font-size:17px}
.price{font-family:'Baloo 2';font-weight:800;font-size:22px;color:var(--pink)}
.btn{border:0;border-radius:999px;padding:13px 20px;font-weight:800;cursor:pointer;color:#fff;background:linear-gradient(90deg,var(--pink),var(--orange));box-shadow:0 6px 16px #ff3d8140;text-decoration:none;display:inline-block;text-align:center}
.btn.green{background:linear-gradient(90deg,#16c060,#00a884);box-shadow:0 6px 16px #00a88440}
.btn.violet{background:linear-gradient(90deg,var(--violet),var(--blue));box-shadow:0 6px 16px #7c3aed40}
.btn.ghost{background:#fff;color:var(--violet);box-shadow:inset 0 0 0 2px var(--violet)}
.btn.red{background:#e11d48}
.btn.small{padding:8px 14px;font-size:14px}
.btn.block{display:block;width:100%}
.box{background:#fff;border-radius:22px;padding:16px;box-shadow:0 6px 18px #2a1b4d14;margin:14px 0}
.gal{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;border-radius:22px}
.gal img{cursor:zoom-in;width:100%;max-width:520px;flex:0 0 100%;scroll-snap-align:center;aspect-ratio:1;object-fit:cover;border-radius:22px}
.qty{display:inline-flex;align-items:center;gap:10px;background:#f3e8ff;border-radius:999px;padding:4px}
.qty button{width:34px;height:34px;border:0;border-radius:50%;background:#fff;font-weight:800;font-size:18px;cursor:pointer;color:var(--violet)}
.row{display:flex;gap:12px;align-items:center}
.row img,.row .th{width:64px;height:64px;border-radius:14px;object-fit:cover;background:var(--yellow);display:grid;place-items:center;font-size:28px;flex:none}
.grow{flex:1;min-width:0}
label{display:block;font-weight:800;margin:12px 0 4px}
input.f,textarea.f,select.f{width:100%;border:2px solid #eadcff;border-radius:14px;padding:12px;background:#fff}
input.f:focus,textarea.f:focus,select.f:focus{outline:0;border-color:var(--violet)}
.muted{color:var(--muted)}
.tag{display:inline-block;border-radius:999px;padding:4px 12px;font-weight:800;font-size:13px;color:#fff}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 20px #2a1b4d22;display:flex;gap:12px;align-items:center}
.bar .price{flex:none}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;z-index:50;max-width:90%}
.tabs{display:flex;gap:8px;overflow-x:auto;margin:14px 0}
.tabs .chip.on{background:var(--pink)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs div{position:relative}
.thumbs img{width:76px;height:76px;object-fit:cover;border-radius:12px}
.thumbs button{position:absolute;top:-6px;right:-6px;width:24px;height:24px;border-radius:50%;border:0;background:#e11d48;color:#fff;font-weight:800;cursor:pointer}
.recibo{background:#fff;border:3px dashed var(--violet);border-radius:18px;padding:20px;max-width:520px;margin:14px auto}
.recibo table{width:100%;border-collapse:collapse}
.recibo td{padding:6px 0;border-bottom:1px solid #eee;vertical-align:top}
.recibo td:last-child{text-align:right;white-space:nowrap}
.foot{text-align:center;color:var(--muted);padding:30px 16px;font-size:14px}
.foot a{color:var(--violet)}
.empty{text-align:center;padding:40px 16px}
.empty .big{font-size:64px}

header.top{background:linear-gradient(90deg,#ff3d81,#ff8a00 60%,#ffd23f)}
.logo{background:#fff;color:var(--pink);padding:4px 16px;border-radius:999px;flex:none;max-width:70%;box-shadow:0 4px 12px #0002;font-size:22px}
.hero{padding:34px 0 70px;background:radial-gradient(circle at 85% 15%,#ffd23f 0 90px,transparent 91px),radial-gradient(circle at 8% 90%,#00c2a8 0 70px,transparent 71px),linear-gradient(135deg,#7c3aed,#ff3d81 60%,#ff8a00)}
.hero h1{font-size:clamp(36px,9vw,64px);text-shadow:0 4px 0 #0002}
.hero:before,.hero:after{display:none}
.wave{display:block;width:100%;height:46px;margin-top:-46px;position:relative}
.perks{display:grid;grid-template-columns:repeat(auto-fit,minmax(100px,1fr));gap:8px;margin:-6px 0 6px}
.perk{border-radius:18px;padding:10px;font-size:13px;line-height:1.2;font-weight:800;color:#fff;display:flex;flex-direction:column;gap:4px;align-items:center;box-shadow:0 6px 14px #0002}
.perk span{font-size:26px}
.perk:nth-child(1){background:linear-gradient(135deg,#16c060,#00a884)}
.perk:nth-child(2){background:linear-gradient(135deg,#3b82f6,#7c3aed)}
.perk:nth-child(3){background:linear-gradient(135deg,#ff8a00,#ff3d81)}
.sec{font-size:30px;margin:22px 0 4px;background:linear-gradient(90deg,var(--violet),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
.grid{gap:16px}
.pcard{border-radius:26px;border-bottom:0;box-shadow:0 10px 26px color-mix(in srgb,var(--c) 45%,transparent);position:relative;background:#fff}
.pcard:hover{transform:translateY(-4px) rotate(-.6deg)}
.pcard a{text-decoration:none}
.pimg{aspect-ratio:1/1;background:linear-gradient(135deg,var(--c),#fff)}
.pbody h3{font-size:18px;min-height:40px}
.pbuy{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:2px}
.pbuy .price{background:var(--c);color:var(--ink);padding:2px 12px;border-radius:999px;font-size:20px}
.pbuy button{width:42px;height:42px;border-radius:50%;border:0;color:#fff;font-size:20px;cursor:pointer;background:linear-gradient(135deg,var(--pink),var(--orange));box-shadow:0 6px 14px #ff3d8155;flex:none}
.zap{position:fixed;right:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;height:54px;padding:0 20px 0 14px;border-radius:999px;background:linear-gradient(135deg,#25d366,#00a884);color:#fff;display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;text-decoration:none;box-shadow:0 8px 22px #00a88470}
.foot{background:linear-gradient(90deg,var(--violet),var(--pink));color:#fff;margin-top:30px;padding:28px 16px 90px;border-radius:32px 32px 0 0}
.foot a{color:var(--yellow)}
.box{border-top:6px solid var(--yellow)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0}
.stat{border-radius:18px;padding:12px;color:#fff;text-align:center;font-weight:800}
.stat b{display:block;font-family:'Baloo 2';font-size:30px}
.stat:nth-child(1){background:linear-gradient(135deg,var(--orange),var(--pink))}
.stat:nth-child(2){background:linear-gradient(135deg,var(--blue),var(--violet))}
.stat:nth-child(3){background:linear-gradient(135deg,var(--teal),#16c060)}

.fx img{width:100%;height:100%;object-fit:contain;display:block}.fx{display:inline-block;width:38px;height:36px;vertical-align:middle;margin-right:6px}.fx svg{width:100%;height:100%;display:block}
.logo{display:flex;align-items:center}
.heroflex{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:6px}
.mascote img{width:100%;display:block}.mascote{width:150px;flex:none;filter:drop-shadow(0 8px 0 #0002);animation:bal 3s ease-in-out infinite}
@keyframes bal{50%{transform:translateY(-6px) rotate(3deg)}}
@media (prefers-reduced-motion:reduce){.mascote{animation:none}}
.lb{position:fixed;inset:0;z-index:100;background:#000e;display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom}
.lb img{max-width:100%;max-height:100%;object-fit:contain}
.lb button{position:absolute;border:0;border-radius:50%;width:48px;height:48px;font-size:24px;font-weight:800;background:#fff;color:var(--ink);cursor:pointer;box-shadow:0 4px 14px #0006}
.lb .x{top:calc(14px + env(safe-area-inset-top,0px));right:14px}
.lb .pv{left:10px;top:50%}.lb .nx{right:10px;top:50%}
.lb .ct{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:0;right:0;text-align:center;color:#fff;font-weight:800}
.zap span{font-size:26px}.zap.off{display:none}
@media print{header.top,.bar,.noprint,.foot{display:none!important}body{background:#fff;padding:0}.recibo{border-color:#000}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#/" id="logo">Loja</a>
  <a class="iconbtn" href="#/carrinho">🛒<b id="cnt">0</b></a>
</div></header>
<div id="app"></div>
<a class="zap" id="zap" href="#" aria-label="Falar pelo WhatsApp" hidden><span>💬</span>WhatsApp</a>
<div class="foot noprint" id="foot"></div>
<script>
const SB='https://bmgzabkzuagegovozvlt.supabase.co';
const KEY='sb_publishable_it6M19GZI8xVbgndOzdaSw_EJjoBZ4-';
const COLORS=['#ff8fb8','#ffc266','#ffe27a','#6ee7d4','#8ab8ff','#c4a1ff'];
const STATUS={aguardando_pagamento:['Aguardando pagamento','#ff8a00'],comprovante_enviado:['Comprovante enviado','#3b82f6'],pago:['Pago','#16a34a'],enviado:['Enviado / entregue','#7c3aed'],cancelado:['Cancelado','#e11d48']};
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const ls={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let cfg={nome:'Minha Loja',slogan:'',whatsapp:'',pix_chave:'',pix_nome:'',pix_cidade:'',aviso:''};
let prods=[],cart=ls.get('loja_cart',[]),sess=ls.get('loja_sess',null),cat='',busca='';

function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
async function api(path,o={}){
  const hd={apikey:KEY,...(o.headers||{})};
  if(sess?.access_token)hd.Authorization='Bearer '+sess.access_token;
  if(o.json!==undefined){hd['Content-Type']='application/json';o.body=JSON.stringify(o.json)}
  const r=await fetch(SB+path,{method:o.method||'GET',headers:hd,body:o.body});
  const txt=await r.text();let d=null;try{d=txt?JSON.parse(txt):null}catch(e){d=txt}
  if(!r.ok)throw new Error((d&&(d.message||d.msg||d.error_description||d.error))||('Erro '+r.status));
  return d;
}
const rpc=(fn,args)=>api('/rest/v1/rpc/'+fn,{method:'POST',json:args});
async function upload(file,pasta){
  const blob=await shrink(file);
  const nome=pasta+'/'+Date.now()+'-'+Math.random().toString(36).slice(2,8)+'.jpg';
  await api('/storage/v1/object/loja/'+nome,{method:'POST',body:blob,headers:{'Content-Type':'image/jpeg'}});
  return SB+'/storage/v1/object/public/loja/'+nome;
}
function shrink(file,max=1100){return new Promise((ok,no)=>{
  if(!file.type.startsWith('image/'))return ok(file);
  const im=new Image(),u=URL.createObjectURL(file);
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?ok(b):no(new Error('Imagem inválida'))},'image/jpeg',.82)};
  im.onerror=()=>no(new Error('Não consegui ler a imagem'));im.src=u})}

function saveCart(){ls.set('loja_cart',cart);$('#cnt').textContent=cart.reduce((a,i)=>a+i.qtd,0)}
function addCart(id,q=1){const i=cart.find(x=>x.id===id);i?i.qtd+=q:cart.push({id,qtd:q});saveCart();toast('Adicionado ao carrinho! 🛍️')}
const prod=id=>prods.find(p=>p.id===id);
const cartTotal=()=>cart.reduce((a,i)=>a+(prod(i.id)?.preco||0)*i.qtd,0);
const foto=p=>p.imagens&&p.imagens[0];
const FOX=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 130"><polygon points="22,10 52,38 18,58" fill="#ff8a00" stroke="#7a3b00" stroke-width="4" stroke-linejoin="round"/><polygon points="118,10 88,38 122,58" fill="#ff8a00" stroke="#7a3b00" stroke-width="4" stroke-linejoin="round"/><polygon points="26,22 42,38 25,48" fill="#ffd0a0"/><polygon points="114,22 98,38 115,48" fill="#ffd0a0"/><path d="M70 28 C108 28 124 52 118 78 C112 100 90 112 70 112 C50 112 28 100 22 78 C16 52 32 28 70 28Z" fill="#ff8a00" stroke="#7a3b00" stroke-width="4"/><path d="M22 78 C30 70 46 74 70 96 C94 74 110 70 118 78 C112 100 90 112 70 112 C50 112 28 100 22 78Z" fill="#fff"/><ellipse cx="50" cy="60" rx="7" ry="9" fill="#2a1b4d"/><ellipse cx="90" cy="60" rx="7" ry="9" fill="#2a1b4d"/><circle cx="52.5" cy="56" r="2.6" fill="#fff"/><circle cx="92.5" cy="56" r="2.6" fill="#fff"/><ellipse cx="36" cy="78" rx="8" ry="5" fill="#ff3d81" opacity=".45"/><ellipse cx="104" cy="78" rx="8" ry="5" fill="#ff3d81" opacity=".45"/><ellipse cx="70" cy="80" rx="8" ry="6" fill="#2a1b4d"/><path d="M58 90 Q70 102 82 90" fill="none" stroke="#2a1b4d" stroke-width="4" stroke-linecap="round"/><g transform="translate(96 86)"><rect x="0" y="16" width="30" height="26" rx="9" fill="#ffd0a0" stroke="#7a3b00" stroke-width="3.5"/><path d="M8 18 L8 4 Q8 -4 15 -2 Q20 0 18 8 L17 16Z" fill="#ffd0a0" stroke="#7a3b00" stroke-width="3.5" stroke-linejoin="round"/></g></svg>`;
function setLogo(){$('#logo').innerHTML='<span class="fx"><img src="raposa-pequena.png" alt=""></span>'+h(cfg.nome)}
const emoji=['🎁','🛍️','✨','🧴','💧','🎀'];

const ABC=(a,b)=>String(a.nome||'').localeCompare(String(b.nome||''),'pt-BR',{sensitivity:'base',numeric:true});
async function load(){
  try{const c=await api('/rest/v1/loja_config?id=eq.1&select=*');if(c&&c[0])cfg=c[0]}catch(e){}
  try{prods=await api('/rest/v1/loja_produtos?select=*&order=created_at.desc');prods.sort(ABC)}catch(e){prods=[]}
  document.title=cfg.nome;setLogo();
  $('#foot').innerHTML=h(cfg.nome)+' · <a href="#/pedido">Acompanhar pedido</a> · <a href="#/admin">Área da loja</a>';
  saveCart();
  const z=$('#zap');if(cfg.whatsapp){z.href=waLink('Olá! Vim pela loja '+cfg.nome+' 😊');z.hidden=false}
}
function waLink(texto){const n=(cfg.whatsapp||'').replace(/\D/g,'');const num=n.length<=11&&n?'55'+n:n;return 'https://wa.me/'+num+'?text='+encodeURIComponent(texto)}

/* ---------- vitrine ---------- */
function vHome(){
  const ativos=prods.filter(p=>p.ativo);
  const cats=[...new Set(ativos.map(p=>p.categoria).filter(Boolean))];
  let lista=ativos.filter(p=>(!cat||p.categoria===cat)&&(!busca||(p.nome+' '+p.descricao).toLowerCase().includes(busca.toLowerCase())));
  $('#app').innerHTML=`${cfg.aviso?`<div class="aviso">${h(cfg.aviso)}</div>`:''}
  <section class="hero"><div class="wrap"><div class="heroflex"><div><h1>${h(cfg.nome)}</h1><p>${h(cfg.slogan)}</p></div><div class="mascote"><img src="raposa.png" alt="Raposa mascote"></div></div>
  <div class="search"><input id="q" placeholder="O que você procura?" value="${h(busca)}"><button class="btn small" id="qb">Buscar</button></div></div></section>
  <svg class="wave" viewBox="0 0 1440 90" preserveAspectRatio="none"><path fill="#fff7fb" d="M0 50 C240 100 480 0 720 40 C960 80 1200 10 1440 50 L1440 90 L0 90Z"/></svg>
  <div class="wrap"><div class="perks"><div class="perk"><span>💬</span>Compra fácil pelo WhatsApp</div><div class="perk"><span>💸</span>Pague com Pix</div><div class="perk"><span>🎁</span>Produtos selecionados</div></div></div>
  <div class="chips"><button class="chip ${!cat?'on':''}" data-c="">✨ Tudo</button>${cats.map(c=>`<button class="chip ${cat===c?'on':''}" data-c="${h(c)}">${h(c)}</button>`).join('')}</div>
  <div class="wrap"><h2 class="sec">${cat?h(cat):'Nossos produtos'} 🛍️</h2>${lista.length?`<div class="grid">${lista.map((p,i)=>card(p,i)).join('')}</div>`:`<div class="empty"><div class="big">🎈</div><h2>${ativos.length?'Nada encontrado':'Em breve, novidades!'}</h2><p class="muted">${ativos.length?'Tente outra palavra.':'Os produtos estão sendo preparados.'}</p></div>`}</div>`;
  $('#qb').onclick=()=>{busca=$('#q').value;vHome()};
  $('#q').onkeydown=e=>{if(e.key==='Enter'){busca=e.target.value;vHome()}};
  document.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addCart(b.dataset.add));
  document.querySelectorAll('.chip[data-c]').forEach(b=>b.onclick=()=>{cat=b.dataset.c;vHome()});

function card(p,i){const c=COLORS[i%COLORS.length];

function lightbox(imgs,i){
  const d=document.createElement('div');d.className='lb';
  const draw=()=>{d.innerHTML=`<img src="${h(imgs[i])}" alt=""><button class="x" aria-label="Fechar">✕</button>${imgs.length>1?`<button class="pv" aria-label="Anterior">‹</button><button class="nx" aria-label="Próxima">›</button><div class="ct">${i+1} / ${imgs.length}</div>`:''}`;
    d.querySelector('.x').onclick=()=>d.remove();
    if(imgs.length>1){d.querySelector('.pv').onclick=()=>{i=(i-1+imgs.length)%imgs.length;draw()};d.querySelector('.nx').onclick=()=>{i=(i+1)%imgs.length;draw()}}};
  let x0=null;d.ontouchstart=e=>{x0=e.touches.length===1?e.touches[0].clientX:null};
  d.ontouchend=e=>{if(x0===null||imgs.length<2)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>60){i=(i+(dx<0?1:-1)+imgs.length)%imgs.length;draw()}x0=null};
  draw();document.body.appendChild(d)}

function crc16(s){let c=0xFFFF;for(let i=0;i<s.length;i++){c^=s.charCodeAt(i)<<8;for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF}return c.toString(16).toUpperCase().padStart(4,'0')}
function pixPayload(chave,nome,cidade,valor,txid){
  const f=(id,v)=>id+String(v.length).padStart(2,'0')+v;
  const norm=(s,n)=>(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^A-Za-z0-9 ]/g,'').toUpperCase().slice(0,n)||'LOJA';
  const body=f('00','01')+f('26',f('00','br.gov.bcb.pix')+f('01',chave))+f('52','0000')+f('53','986')+f('54',Number(valor).toFixed(2))+f('58','BR')+f('59',norm(nome,25))+f('60',norm(cidade,15))+f('62',f('05',(txid||'***').replace(/[^A-Za-z0-9]/g,'').slice(0,25)||'***'))+'6304';
  return body+crc16(body);
}

    try{
      for(const f of adm.files)p.imagens.push(await upload(f,'produtos'));
      const row={nome:p.nome.trim(),descricao:p.descricao,preco,categoria:p.categoria.trim(),imagens:p.imagens,estoque:p.estoque,ativo:p.ativo};
      if(p.id)await api('/rest/v1/loja_produtos?id=eq.'+p.id,{method:'PATCH',json:row});
      else await api('/rest/v1/loja_produtos',{method:'POST',json:row});
      prods=await api('/rest/v1/loja_produtos?select=*&order=created_at.desc');prods.sort(ABC);adm.edit=null;adm.files=[];toast('Produto salvo! 🎉');aProdutos();
    }catch(e){toast(e.message);$('#ps').disabled=false;$('#ps').textContent='Salvar produto'}};
}
function aConfig(){
  $('#ad').innerHTML=`<div class="box"><h3>Dados da loja</h3>
  <label for="cnm">Nome da loja</label><input class="f" id="cnm" value="${h(cfg.nome)}">
  <label for="csl">Frase de destaque</label><input class="f" id="csl" value="${h(cfg.slogan)}">
  <label for="cwa">WhatsApp da loja (com DDD)</label><input class="f" id="cwa" type="tel" value="${h(cfg.whatsapp)}" placeholder="22999999999">
  <label for="cav">Aviso no topo (opcional)</label><input class="f" id="cav" value="${h(cfg.aviso)}" placeholder="Ex.: Frete grátis em Cabo Frio!">
  <h3 style="margin-top:18px">Pix (para o cliente pagar)</h3>
  <label for="cpx">Chave Pix</label><input class="f" id="cpx" value="${h(cfg.pix_chave)}">
  <label for="cpn">Nome do recebedor</label><input class="f" id="cpn" value="${h(cfg.pix_nome)}">
  <label for="cpi">Cidade</label><input class="f" id="cpi" value="${h(cfg.pix_cidade)}">
  <p></p><button class="btn block" id="cs">Salvar</button></div>`;
  $('#cs').onclick=async()=>{const n={nome:$('#cnm').value,slogan:$('#csl').value,whatsapp:$('#cwa').value,aviso:$('#cav').value,pix_chave:$('#cpx').value.trim(),pix_nome:$('#cpn').value,pix_cidade:$('#cpi').value};
    try{await api('/rest/v1/loja_config?id=eq.1',{method:'PATCH',json:n});cfg={...cfg,...n};document.title=cfg.nome;setLogo();toast('Salvo! ✅')}catch(e){toast(e.message)}};
}

/* ---------- rotas ---------- */
function route(){
  const z=$('#zap');if(z)z.classList.toggle('off',/^#\/(recibo|admin)/.test(location.hash));
  const [,a,b]=(location.hash||'#/').split('/');window.scrollTo(0,0);
  if(a==='produto')vProduto(b);else if(a==='carrinho')vCarrinho();else if(a==='pedido')vPedido(b);else if(a==='recibo')vRecibo(b);else if(a==='admin')vAdmin();else vHome();
}
addEventListener('hashchange',route);
load().then(route);
</script>
